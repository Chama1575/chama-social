{% extends 'base.html' %}{% block content %}<div class="card narrow"><h1>Novo usuário</h1><form method="post"><label>Nome<input name="nome" required></label><label>Login<input name="login" required></label><label>Perfil<select name="perfil"><option value="operador">Operador</option><option value="visualizador">Visualizador</option><option value="admin">Administrador</option></select></label><label>Senha temporária<input name="senha" type="password" required autocomplete="new-password"></label><button>Criar usuário</button></form><p class="hint">No primeiro login, o usuário será obrigado a criar uma nova senha.</p></div>{% endblock %}
