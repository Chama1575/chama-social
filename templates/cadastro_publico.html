{% extends 'public_base.html' %}{% block content %}<div class="card"><h1>{{evento['nome']}}</h1><p>{{evento['data']}} · {{evento['local']}}</p><form method="post"><label>Atendimento<select name="atendimento_id" required><option value="">Selecione</option>{% for a in atendimentos %}{% if a['ocupadas'] < a['vagas'] %}<option value="{{a['id']}}">{{a['nome']}} — {{a['vagas']-a['ocupadas']}} vagas restantes</option>{% endif %}{% endfor %}</select></label>{% for c in campos %}<label>{{c['titulo']}}{% if c['tipo']=='opcoes' %}<select name="campo_{{c['id']}}" {% if c['obrigatorio'] %}required{% endif %}><option value="">Selecione</option>{% for op in (c['opcoes'] or '').split(',') %}<option>{{op.strip()}}</option>{% endfor %}</select>{% else %}<input name="campo_{{c['id']}}" type="{{'number' if c['tipo']=='numero' else 'date' if c['tipo']=='data' else 'text'}}" {% if c['obrigatorio'] %}required{% endif %}>{% endif %}</label>{% endfor %}<button>Confirmar inscrição</button></form></div>{% endblock %}
