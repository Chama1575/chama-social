<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Chama Social</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="loginbody"><div class="loginbox"><h1>Chama Social</h1><p>Acesso ao painel</p>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><label>Usuário<input name="login" required autofocus></label><label>Senha<input name="senha" type="password" required></label><button>Entrar</button></form></div></body></html>
