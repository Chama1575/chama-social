{% extends 'base.html' %}{% block content %}<div class="card"><h1>{{titulo}}</h1><form method="post"><label>Pergunta<input name="titulo" value="{{item['titulo']}}" required></label><label>Tipo<select name="tipo"><option value="texto" {% if item['tipo']=='texto' %}selected{% endif %}>Texto</option><option value="numero" {% if item['tipo']=='numero' %}selected{% endif %}>Número</option><option value="data" {% if item['tipo']=='data' %}selected{% endif %}>Data</option><option value="opcoes" {% if item['tipo']=='opcoes' %}selected{% endif %}>Opções</option></select></label><label>Opções<input name="opcoes" value="{{item['opcoes'] or ''}}"></label><label class="check"><input type="checkbox" name="obrigatorio" {% if item['obrigatorio'] %}checked{% endif %}> Obrigatório</label>{% if not voluntario %}<label class="check"><input type="checkbox" name="marcador_cpf" {% if item['marcador_cpf'] %}checked{% endif %}> Este campo é o CPF</label>{% endif %}<button>Salvar alterações</button></form></div>{% endblock %}
